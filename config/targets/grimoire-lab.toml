# Target: Grimoire on the Athena lab network
# Join grimoire-web to nexus-athena_athena_lab via docker-compose.athena.yml.
#
#   cd grimoire-workbench
#   docker compose -f docker-compose.yml -f docker-compose.athena.yml up -d web
#
# Then: ./scripts/run-athena-profile.sh agent grimoire-lab
target_id = "grimoire-lab"
host = "grimoire.lab"
port = 3000
protocol = "http"

[scenario]
objective = "Map the Grimoire writing-assistant API from the athena.agent container on athena_lab"
techniques = ["T1595", "T1190"]
max_actions = 8

[api]
base_path = "/api"
public_endpoints = [
  "GET /health",
  "GET /auth/status",
]

[labels]
scenario_family = "web-app-pentest"
difficulty = "beginner"
platform = "grimoire-workbench"
execution_context = "compose"
