# Target: Grimoire (host-side UI)
# The live surface is the SvelteKit UI. It proxies /api to cargo on 127.0.0.1:3010.
# Auth is enabled in the operator's gitignored local config — do not store passwords here.
#
# Do not use host "localhost" — that identity is already claimed by novel-directory :8090.
# Compose-joined API runs use targets/grimoire-lab.toml (grimoire.lab:3000).
target_id = "grimoire"
host = "127.0.0.1"
port = 4400
protocol = "http"

[scenario]
objective = "Map the local Grimoire UI at / and the proxied public API paths. Do not invent login or register tools."
techniques = ["T1595", "T1190"]
max_actions = 8

[api]
base_path = "/api"
public_endpoints = [
  "GET /",
  "GET /api/health",
  "GET /api/auth/status",
]

[labels]
scenario_family = "web-app-pentest"
difficulty = "beginner"
platform = "grimoire-workbench"
execution_context = "host"
