# Athena Tool Registry
# Format matches ToolEntry model in orchestrator/tool_registry.py

[tools.nmap-scan]
executable = "nmap"
invocation = "subprocess"
required_capabilities = []
description = "Service version scan against target"

[tools.nmap-scan.args]
[tools.nmap-scan.args.target]
type = "string"
required = true

[tools.http-request]
module = "orchestrator.tools.http_request"
invocation = "in-process"
required_capabilities = []
description = "GET an allowlisted HTTP path (labeled traffic, no request body)"

[tools.http-request.args]
[tools.http-request.args.url]
type = "string"
required = false
[tools.http-request.args.target]
type = "string"
required = true
[tools.http-request.args.port]
type = "integer"
required = true
min = 1
max = 65535
[tools.http-request.args.path]
type = "string"
required = false
default = "/"
[tools.http-request.args.method]
type = "string"
required = false
default = "GET"
enum = ["GET"]

[tools.modbus-read]
executable = "${ATHENA_BIN_DIR}/athena-modbus"
invocation = "subprocess"
required_capabilities = []
description = "Read Modbus TCP registers"

[tools.modbus-read.args]
[tools.modbus-read.args.target]
type = "string"
required = true
[tools.modbus-read.args.unit_id]
type = "integer"
required = true
min = 1
max = 247
[tools.modbus-read.args.address]
type = "integer"
required = true
min = 0
max = 65535
[tools.modbus-read.args.quantity]
type = "integer"
required = false
default = 1

[tools.modbus-write]
executable = "${ATHENA_BIN_DIR}/athena-modbus"
invocation = "subprocess"
required_capabilities = ["ICS_WRITE"]
description = "Write to Modbus TCP register (requires ICS_WRITE)"

[tools.modbus-write.args]
[tools.modbus-write.args.target]
type = "string"
required = true
[tools.modbus-write.args.unit_id]
type = "integer"
required = true
min = 1
max = 247
[tools.modbus-write.args.address]
type = "integer"
required = true
min = 0
max = 65535
[tools.modbus-write.args.value]
type = "integer"
required = true

[tools.canbus-inject]
executable = "${ATHENA_BIN_DIR}/athena-canbus"
invocation = "subprocess"
required_capabilities = ["CAN_INJECT"]
description = "Inject a CAN frame (requires CAN_INJECT)"

[tools.canbus-inject.args]
[tools.canbus-inject.args.interface]
type = "string"
required = true
[tools.canbus-inject.args.id]
type = "string"
required = true
[tools.canbus-inject.args.data]
type = "string"
required = true

[tools.register-user]
executable = "curl"
invocation = "subprocess"
required_capabilities = []
description = "Register a new user account on the target"

[tools.register-user.args]
[tools.register-user.args.base_url]
type = "string"
required = true
[tools.register-user.args.username]
type = "string"
required = true
[tools.register-user.args.email]
type = "string"
required = true
[tools.register-user.args.password]
type = "string"
required = true

[tools.login-user]
executable = "curl"
invocation = "subprocess"
required_capabilities = []
description = "Login and obtain JWT token"

[tools.login-user.args]
[tools.login-user.args.base_url]
type = "string"
required = true
[tools.login-user.args.email]
type = "string"
required = true
[tools.login-user.args.password]
type = "string"
required = true
