apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-deny-soc
  namespace: nexus-athena
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: nexus-zone
                operator: DoesNotExist
