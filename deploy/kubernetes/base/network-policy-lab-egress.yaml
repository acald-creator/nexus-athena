apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-lab-egress
  namespace: nexus-athena
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-athena
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nexus-lab-network: "true"
          podSelector:
            matchLabels:
              nexus-lab-target: "true"
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
