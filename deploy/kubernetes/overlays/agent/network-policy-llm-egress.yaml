apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-egress
  namespace: nexus-athena
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes:
    - Egress
  egress:
    # Allow access to LLM inference service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-inference
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to lab targets (athena_lab network)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 502   # Modbus
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 3000  # Common app ports
