name: nexus-athena
services:
  athena.standard:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.standard
    hostname: athena-standard
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - athena_lab

  athena.packet-lab:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.packet-lab
    hostname: athena-packet-lab
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - athena_lab
    profiles:
      - packet-lab

  athena.exploit-lab:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.exploit-lab
    hostname: athena-exploit-lab
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      - athena_lab
    profiles:
      - exploit-lab

  athena.agent:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.agent
    hostname: athena-agent
    tty: true
    stdin_open: true
    command: ["/usr/local/bin/athena-agent-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ATHENA_CONFIG_DIR=/opt/athena/config
      - ATHENA_TOOL_REGISTRY=/opt/athena/config/tool-registry.toml
      - ATHENA_ALLOWLIST=/opt/athena/config/allowlist.json
      - ATHENA_TARGET=${ATHENA_TARGET:-}
      - ATHENA_SCENARIO_LABEL=${ATHENA_SCENARIO_LABEL:-}
      - ATHENA_GT_OUTPUT=/opt/athena/output/ground-truth.jsonl
    volumes:
      - ${ATHENA_CONFIG_PATH:-./config}:/opt/athena/config:ro
      - athena_output:/opt/athena/output
    networks:
      - athena_lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - agent

  athena.agent-ics:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.agent-ics
    hostname: athena-agent-ics
    tty: true
    stdin_open: true
    command: ["/usr/local/bin/athena-agent-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ATHENA_CONFIG_DIR=/opt/athena/config
      - ATHENA_TOOL_REGISTRY=/opt/athena/config/tool-registry.toml
      - ATHENA_ALLOWLIST=/opt/athena/config/allowlist.json
      - ATHENA_TARGET=${ATHENA_TARGET:-}
      - ATHENA_SCENARIO_LABEL=${ATHENA_SCENARIO_LABEL:-}
      - ATHENA_GT_OUTPUT=/opt/athena/output/ground-truth.jsonl
      - ATHENA_CAPABILITIES=ICS_WRITE,CAN_INJECT
    volumes:
      - ${ATHENA_CONFIG_PATH:-./config}:/opt/athena/config:ro
      - athena_output:/opt/athena/output
    networks:
      - athena_lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - agent-ics

networks:
  athena_lab:
    driver: bridge

volumes:
  athena_output:
    driver: local
