name: nexus-athena
services:
  athena.standard:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.standard
    hostname: athena-standard
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - athena_lab

  athena.packet-lab:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.packet-lab
    hostname: athena-packet-lab
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - athena_lab
    profiles:
      - packet-lab

  athena.exploit-lab:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.exploit-lab
    hostname: athena-exploit-lab
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      - athena_lab
    profiles:
      - exploit-lab

  athena.agent:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.agent
    hostname: athena-agent
    tty: true
    stdin_open: true
    command: ["/usr/local/bin/athena-agent-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ATHENA_CONFIG_DIR=/opt/athena/config
      - ATHENA_TOOL_REGISTRY=/opt/athena/config/tool-registry.toml
      - ATHENA_ALLOWLIST=/opt/athena/config/allowlist.json
      - ATHENA_TARGET=${ATHENA_TARGET:-}
      - ATHENA_SCENARIO_LABEL=${ATHENA_SCENARIO_LABEL:-}
      - ATHENA_GT_OUTPUT=/opt/athena/output/ground-truth.jsonl
    volumes:
      - ${ATHENA_CONFIG_PATH:-../../config}:/opt/athena/config:ro
      - athena_output:/opt/athena/output
    networks:
      - athena_lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - agent

  athena.agent-ics:
    image: ${ATHENA_IMAGE:-phoenixvlabs/nexus-athena:latest}
    container_name: athena.agent-ics
    hostname: athena-agent-ics
    tty: true
    stdin_open: true
    command: ["/usr/local/bin/athena-agent-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ATHENA_CONFIG_DIR=/opt/athena/config
      - ATHENA_TOOL_REGISTRY=/opt/athena/config/tool-registry.toml
      - ATHENA_ALLOWLIST=/opt/athena/config/allowlist.json
      - ATHENA_TARGET=${ATHENA_TARGET:-}
      - ATHENA_SCENARIO_LABEL=${ATHENA_SCENARIO_LABEL:-}
      - ATHENA_GT_OUTPUT=/opt/athena/output/ground-truth.jsonl
      - ATHENA_CAPABILITIES=ICS_WRITE,CAN_INJECT
    volumes:
      - ${ATHENA_CONFIG_PATH:-../../config}:/opt/athena/config:ro
      - athena_output:/opt/athena/output
    networks:
      - athena_lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - agent-ics


  # ─── Lab Targets ─────────────────────────────────────────────────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop.lab
    hostname: juice-shop.lab
    ports:
      - "3001:3000"
    networks:
      - athena_lab
    profiles:
      - targets

  # --- SOC Detection (runs on athena_lab to see agent traffic) ---
  suricata.sensor:
    image: jasonish/suricata:7.0
    container_name: athena-suricata
    hostname: suricata.sensor
    command: ["-i", "eth0", "-c", "/etc/suricata/suricata.yaml"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../../suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - suricata_logs:/var/log/suricata
    networks:
      - athena_lab
    restart: unless-stopped
    profiles:
      - detection

  suricata.forwarder:
    image: busybox:1.36
    container_name: athena-suricata-forwarder
    depends_on:
      - suricata.sensor
    command: ["/bin/sh", "-c", "touch /var/log/suricata/eve.json && tail -F /var/log/suricata/eve.json"]
    volumes:
      - suricata_logs:/var/log/suricata:ro
    networks:
      - athena_lab
    restart: unless-stopped
    profiles:
      - detection


networks:
  athena_lab:
    driver: bridge

volumes:
  athena_output:
    driver: local
  suricata_logs:
    driver: local
